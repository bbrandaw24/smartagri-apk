plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.smartagri'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.smartagri"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 纯 WebView 壳，零第三方依赖（不引 AndroidX），编译快、体积小
dependencies {
}
